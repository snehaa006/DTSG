services:
  - type: web
    name: dtsg-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Supabase -> Project Settings -> Database -> Connection string ->
      # "Transaction pooler" (port 6543). The direct db.<ref>.supabase.co host
      # is IPv6-only and will not resolve from Render.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      # Set to the deployed Vercel origin once the frontend is live.
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
